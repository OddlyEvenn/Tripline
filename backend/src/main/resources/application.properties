spring.config.import=optional:file:.env[.properties]
# ===========================
# SERVER
# ===========================
# Use Render's dynamic PORT env var; fall back to 8080 locally
server.port=${PORT:8080}
# Lazy init: bind the HTTP port immediately, create beans on first use
# This prevents Render's port-scan timeout during slow DB/Redis warmup
spring.main.lazy-initialization=true
server.servlet.context-path=/api

# ===========================
# DATASOURCE (Oracle Free SQL)
# ===========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
# Keep minimum-idle low (1) so Oracle free-tier doesn't stall 5 connections at boot
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.spatial.connection_finder=com.tripline.config.JpaConfig$HikariConnectionFinder

# Hibernate Batching Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ===========================
# REDIS
# ===========================
spring.data.redis.url=${UPSTASH_REDIS_URL:}
spring.data.redis.ssl.enabled=true
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000
jwt.refresh.expiration.ms=604800000

# ===========================
# OAUTH2 (Google)
# ===========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email


# ===========================
# STRIPE
# ===========================
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.success.url=${FRONTEND_URL}/booking-confirmation
stripe.cancel.url=${FRONTEND_URL}/payment-cancelled

# ===========================
# BREVO (REST API v3)
# ===========================
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Tripline

# ===========================
# CORS
# ===========================
frontend.url=${FRONTEND_URL}

# ===========================
# JACKSON
# ===========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=GMT+05:30
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ===========================
# LOGGING
# ===========================
logging.level.com.tripline=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
